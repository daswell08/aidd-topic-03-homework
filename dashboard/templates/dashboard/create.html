{% extends "dashboard/base.html" %}

{% block title %}
<title>Добавить инструмент</title>
{% endblock %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="w-100 btn btn-lg btn-primary mt-5" type="submit">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
